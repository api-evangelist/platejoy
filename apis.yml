name: PlateJoy
description: PlateJoy is a personalized digital meal-planning and nutrition subscription service
  that generates customized weekly meal plans, recipes, and auto-built grocery lists from a detailed
  dietary and lifestyle questionnaire, with grocery-delivery hand-off. Founded in 2012 and later
  acquired into the Health.com / Dotdash Meredith consumer-health portfolio, it operates as a
  consumer-facing web and mobile app. As of this enrichment pass PlateJoy exposes no public developer
  API, OpenAPI, or documentation surface. The apex domain has no live web host and the www endpoint
  resolves to a dangling AWS load balancer, so only domain-level DNS/email security could be probed.
